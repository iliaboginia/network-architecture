<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="980" viewBox="0 0 1360 980" role="img" aria-labelledby="title desc">
<title id="title">Policy-based routing and WireGuard for a subsidiary</title>
<desc id="desc">A shared access switch serves corporate and subsidiary VLANs. A MikroTik gateway preserves internal routes, directs subsidiary Internet traffic to a separate circuit from the same ISP, and terminates WireGuard through that circuit.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker>
</defs>
<rect width="1360" height="980" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="43" font-size="30" fill="#0f172a" font-weight="700" text-anchor="start">Dedicated WAN routing and WireGuard</text>
<text x="40" y="69" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Separate Internet egress, shared corporate services and remote access</text>
<rect x="40" y="310" width="340" height="460" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="342" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">Shared branch access</text>
<path d="M350 410 H380 V670 H350" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M210 600 V650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M350 700 H455 V465 H500" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M670 375 V255" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
<path d="M840 410 H930 V145 H1010" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M840 460 H960 V385 H1010" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<path d="M840 515 H900 V672.5 H1010" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)" marker-start="url(#arrow-teal)" stroke-dasharray="8 6"/>
<rect x="490" y="90" width="360" height="165" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="670.0" y="122" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">Head-office services</text>
<text x="670.0" y="154" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Domain controller</text>
<text x="670.0" y="178" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Mail, ticketing and internal portal</text>
<text x="670.0" y="202" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Reachable through internal routes</text>
<rect x="1010" y="80" width="300" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1160.0" y="112" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">Corporate Internet</text>
<text x="1160.0" y="144" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Existing/default connection</text>
<text x="1160.0" y="168" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Ordinary users</text>
<rect x="1010" y="300" width="300" height="170" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="1160.0" y="332" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">Dedicated Internet circuit</text>
<text x="1160.0" y="364" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Same ISP, separate connection</text>
<text x="1160.0" y="388" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Fixed public address</text>
<text x="1160.0" y="412" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Subsidiary Internet and VPN</text>
<text x="1160.0" y="436" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">No shared-WAN fallback</text>
