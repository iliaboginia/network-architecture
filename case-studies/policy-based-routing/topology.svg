<text x="670.0" y="439" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Source-based WAN policy</text>
<text x="670.0" y="463" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Internal destination exceptions</text>
<text x="670.0" y="487" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Separate WireGuard endpoint</text>
<text x="670.0" y="511" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Local UDP routing and NAT</text>
<rect x="70" y="370" width="280" height="85" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="210.0" y="402" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">Corporate users</text>
<text x="210.0" y="434" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Existing/default network</text>
<rect x="70" y="490" width="280" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="210.0" y="522" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">Subsidiary users</text>
<text x="210.0" y="554" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Separate subnet and VLAN</text>
<text x="210.0" y="578" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">Shared physical access layer</text>
<rect x="70" y="650" width="280" height="75" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="210.0" y="682" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">Managed access switch</text>
<text x="210.0" y="714" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">VLAN-aware uplink</text>
<rect x="1010" y="610" width="300" height="125" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="1160.0" y="642" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">WireGuard client</text>
<text x="1160.0" y="674" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">VPN access to branch LAN</text>
<text x="1160.0" y="698" font-size="15.5" fill="#334155" font-weight="400" text-anchor="middle">and subsidiary VLAN</text>
<rect x="402" y="600" width="106" height="24" rx="5" fill="#ffffff"/>
<text x="455" y="617" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">VLAN uplink</text>
<text x="695" y="295" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start">Internal services</text>
<text x="695" y="316" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start">stay on internal routes</text>
<text x="945" y="256" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start">Default WAN</text>
<text x="858" y="488" font-size="14" fill="#d97706" font-weight="400" text-anchor="start">PBR / selected subnet</text>
<text x="920" y="554" font-size="14" fill="#0f766e" font-weight="400" text-anchor="start">Encrypted UDP</text>
<text x="920" y="575" font-size="14" fill="#0f766e" font-weight="400" text-anchor="start">dedicated circuit</text>
<circle cx="60" cy="815" r="5" fill="#64748b"/>
<text x="74" y="821" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Shared VLAN transport</text>
<circle cx="350" cy="815" r="5" fill="#2563eb"/>
<text x="364" y="821" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Corporate routes / normal WAN</text>
<circle cx="730" cy="815" r="5" fill="#d97706"/>
<text x="744" y="821" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Dedicated WAN policy</text>
<circle cx="1060" cy="815" r="5" fill="#0f766e"/>
<text x="1074" y="821" font-size="14" fill="#475569" font-weight="400" text-anchor="start">WireGuard transport</text>
<rect x="40" y="855" width="1270" height="74" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
<text x="60" y="884" font-size="17" fill="#92400e" font-weight="700" text-anchor="start">Required outage policy: no external access when the dedicated circuit is unavailable.</text>
<text x="60" y="909" font-size="15" fill="#92400e" font-weight="400" text-anchor="start">Internet traffic must not fall back to the shared WAN. Local destinations follow their internal routing policy.</text>
<text x="40" y="958" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">Anonymised logical view. Device roles and traffic policies are shown; production addresses and keys are omitted.</text>
</g>
</svg>
